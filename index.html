<!DOCTYPE html>
<html lang="fr">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-L77E9L8T8T"></script>
<script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DIABLO - CHARO JSK OFFICIAL</title>
<link rel="manifest" href="manifest.json">

<style>
:root{--bg:#08080c;--card:#17171f;--p:#a855f7;--p2:#ff1744}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden;touch-action:pan-y}
body{background:var(--bg);color:#fff;padding-bottom:125px;overflow-x:hidden;width:100%}
.cover{height:250px;position:relative;background:radial-gradient(ellipse at top,#a855f7 0%, #1a0a2e 40%, #08080c 80%);border-radius:0 0 36px 36px;overflow:hidden;width:100%}
.cover::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 15%, transparent 60%)}
.install{position:absolute;top:18px;right:18px;z-index:10;background:#a855f7;backdrop-filter:blur(12px);border:none;padding:10px 18px;border-radius:22px;color:#fff;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 4px 15px #a855f780;display:none}
.install.show{display:block}
.cover-content{position:absolute;bottom:18px;left:20px;right:20px;z-index:2;display:flex;align-items:flex-end;gap:15px}
.avatar{width:88px;height:88px;border-radius:24px;border:3px solid #fff;background:#000;object-fit:cover;box-shadow:0 12px 30px #000, 0 0 20px #a855f799}
.cover-text h1{font-size:30px;font-weight:800} .cover-text h1 span{color:var(--p2)}
.cover-text p{font-size:11px;letter-spacing:2px;opacity:.8;background:#ffffff14;padding:6px 14px;border-radius:20px;margin-top:6px;display:inline-block}
.search{padding:18px 20px;width:100%}.search input{width:100%;background:var(--card);border:1px solid #ffffff10;padding:15px 20px;border-radius:18px;color:#fff;outline:none}
.grid{padding:0 20px;display:grid;gap:14px;width:100%}
.card{background:var(--card);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;border:1px solid #ffffff08;width:100%;overflow:visible;position:relative}
.thumb{width:58px;height:58px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.info{flex:1;min-width:0;overflow:hidden}.info h3{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info small{color:#888;font-size:11px}
.video-wrap{width:100%;margin-top:10px;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:16/9;position:relative}
.video-wrap video{width:100%;height:100%;object-fit:cover;display:block}
.btn-down{width:44px;height:44px;min-width:44px;min-height:44px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;flex-shrink:0;z-index:5;box-shadow:0 4px 15px #a855f760;border:none}
.menu-dot{width:44px;height:44px;min-width:44px;border-radius:12px;background:#ffffff10;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;cursor:pointer;border:1px solid #ffffff10;position:relative}
.bottom{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:92%;max-width:400px;background:rgba(26,26,36,0.92);backdrop-filter:blur(20px);border:1px solid #ffffff15;border-radius:30px;display:flex;justify-content:space-around;align-items:center;padding:12px 10px;z-index:100}
.nav-item{flex:1;background:none;border:none;color:#666;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}.nav-item.active{color:#fff}
.plus{width:66px;height:66px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));border:4px solid var(--bg);font-size:34px;color:#fff;margin-top:-36px;box-shadow:0 10px 30px #a855f7a0;cursor:pointer}
.modal{position:fixed;inset:0;background:#000000d5;backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}.modal.show{display:flex}
.box{background:#1e1e2a;width:100%;max-width:400px;border-radius:28px;padding:28px;border:1px solid #ffffff12;position:relative; max-height:90vh; overflow-y:auto}
.box input,.box select{width:100%;background:#0a0a0f;border:1px solid #ffffff12;padding:14px;border-radius:14px;color:#fff;margin-bottom:12px;outline:none}
.box button.main{width:100%;padding:15px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700;cursor:pointer}
.close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:#ffffff12;border:none;color:#fff;font-size:20px;cursor:pointer}
.creator-item{background:#0a0a0f;border:1px solid #ffffff10;border-radius:16px;padding:12px;margin-bottom:12px}
.del-btn{width:100%;margin-top:8px;background:#ff1744;border:none;padding:10px;border-radius:10px;color:#fff;font-weight:800;cursor:pointer}
.audio-player{width:100%;margin-top:10px;background:#0a0a0f;border-radius:12px;padding:10px 12px;border:1px solid #ffffff08}
.audio-controls{display:flex;align-items:center;gap:10px}
.play-btn{width:36px;height:36px;min-width:36px;border-radius:10px;background:#fff;color:#000;border:none;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;flex-shrink:0}
.progress-area{flex:1}
.progress-bg{width:100%;height:4px;background:#ffffff18;border-radius:10px;overflow:hidden;cursor:pointer;position:relative}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:10px;transition:width 0.1s linear}
.time-row{display:flex;justify-content:space-between;margin-top:4px;font-size:10px;color:#777}
.dropdown{position:absolute;right:0;top:50px;background:#1e1e2a;border:1px solid #ffffff15;border-radius:14px;padding:6px;width:170px;z-index:20;display:none;box-shadow:0 10px 30px #000}
.dropdown.show{display:block}
.dropdown button{width:100%;background:none;border:none;color:#fff;padding:10px 12px;text-align:left;border-radius:8px;font-size:13px;cursor:pointer;display:flex;gap:8px;align-items:center}
.dropdown button:hover{background:#ffffff10}
</style>
</head>
<body>
<div class="cover">
  <button id="installBtn" class="install" onclick="installApp()">📲 Installer l'App</button>
  <div class="cover-content">
    <img class="avatar" src="charo-192.png" alt="DIABLO">
    <div class="cover-text"><h1>jiska <span>JSK</span></h1><p>CHARO JSK • OFFICIAL</p></div>
  </div>
</div>
<div class="search"><input id="search" placeholder="Rechercher..." oninput="render()"></div>
<div id="list" class="grid"><div style="text-align:center;padding:60px;color:#666">Connexion à Supabase...</div></div>
<div class="bottom">
  <button class="nav-item active" id="b-audio" onclick="setTab('audio')">🎵 AUDIO</button>
  <button class="plus" onclick="openPass()">+</button>
  <button class="nav-item" id="b-video" onclick="setTab('video')">🎬 VIDEO</button>
</div>
<div class="modal" id="passModal"><div class="box"><button class="close" onclick="closeAll()">×</button><h2 style="text-align:center">Accès 🔒</h2><p style="text-align:center;color:#888;font-size:12px;margin-bottom:12px">Mot de passe: Diablo</p><input type="password" id="passInput" placeholder="Mot de passe"><button class="main" onclick="checkPass()">Entrer</button><p id="err" style="display:none;color:#ff4d4d;text-align:center;margin-top:10px">Faux code</p></div></div>
<div class="modal" id="pubModal"><div class="box" style="max-width:420px"><button class="close" onclick="closeAll()">×</button>
<h2 style="text-align:center">Creator Studio 🚀</h2>
<input id="titre" placeholder="Titre ex: DIABLO - Amour Noir">
<select id="type"><option value="audio">🎵 AUDIO</option><option value="video">🎬 VIDEO</option></select>
<input type="file" id="file" accept="audio/*,video/*">
<button class="main" id="pubBtn" onclick="publier()">Publier sur Supabase</button>
<p id="loading" style="display:none;text-align:center;color:#a855f7;margin-top:12px">Upload en cours...</p>
<hr style="margin:20px 0;border:none;border-top:1px solid #ffffff15">
<h3 style="font-size:14px;margin-bottom:12px">📂 Tous mes médias (avec suppression)</h3>
<div id="creator-list">Chargement...</div>
</div></div>
<script>
const SUPABASE_URL = "https://ooitwgbvscipunaszoml.supabase.co";
const SUPABASE_KEY = "sb_publishable_HmpP9zKKCRJLtd_X2taQbg_MTt81Qsn";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const PASSWORD="Diablo";let tab='audio';let allData=[];let currentAudio=null;
function setTab(t){tab=t;document.getElementById('b-audio').classList.toggle('active',t=='audio');document.getElementById('b-video').classList.toggle('active',t=='video');render();}
function openPass(){document.getElementById('passModal').classList.add('show');}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'));}
function checkPass(){if(document.getElementById('passInput').value.trim()===PASSWORD){closeAll();setTimeout(()=>{document.getElementById('pubModal').classList.add('show'); loadCreatorMedia();},200);document.getElementById('passInput').value='';document.getElementById('err').style.display='none';}else{document.getElementById('err').style.display='block';}}
async function fetchData(){const {data,error}=await supabaseClient.from('musics').select('*').order('created_at',{ascending:false});if(error){document.getElementById('list').innerHTML=`<div style="text-align:center;padding:40px;color:#ff5a5a">Erreur: ${error.message}</div>`;return;}allData=data||[];render();}
async function publier(){let tit=document.getElementById('titre').value.trim();let typ=document.getElementById('type').value;let f=document.getElementById('file').files[0];if(!tit||!f)return alert('Titre + fichier obligatoire');document.getElementById('loading').style.display='block';document.getElementById('pubBtn').disabled=true;try{let fileName=Date.now()+"_"+f.name.replace(/[^a-zA-Z0-9.\-_]/g,'_');let {error:upErr}=await supabaseClient.storage.from('media').upload(fileName,f);if(upErr)throw upErr;let {data:urlData}=supabaseClient.storage.from('media').getPublicUrl(fileName);let {error:dbErr}=await supabaseClient.from('musics').insert({titre:tit,type:typ,url:urlData.publicUrl,name:f.name});if(dbErr)throw dbErr;document.getElementById('titre').value='';document.getElementById('file').value='';await fetchData(); await loadCreatorMedia(); setTab(typ);alert('Publié !');}catch(e){alert("Erreur: "+e.message);}document.getElementById('loading').style.display='none';document.getElementById('pubBtn').disabled=false;}
async function loadCreatorMedia(){const listDiv=document.getElementById('creator-list');listDiv.innerHTML='Chargement...';const {data,error}=await supabaseClient.from('musics').select('*').order('created_at',{ascending:false});if(error){listDiv.innerHTML='Erreur: '+error.message; return;}if(!data.length){listDiv.innerHTML='<small style="color:#666">Aucun média</small>'; return;}listDiv.innerHTML=data.map(d=>`<div class="creator-item"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:13px">${d.titre}</b><small style="color:#888">${d.type}</small></div><small style="color:#555;font-size:10px;word-break:break-all">${d.url}</small>${d.type==='audio'?`<audio controls src="${d.url}" style="width:100%;margin-top:6px;height:32px"></audio>`:`<video controls src="${d.url}" style="width:100%;margin-top:6px;border-radius:8px;max-height:140px"></video>`}<button class="del-btn" onclick="deleteMedia('${d.id}','${d.url}')">🗑️ SUPPRIMER</button></div>`).join('');}
async function deleteMedia(id, url){if(!confirm('Vraiment supprimer ce média ?')) return;try{let fileName = url.split('/').pop().split('?')[0];await supabaseClient.storage.from('media').remove([fileName]);let {error}=await supabaseClient.from('musics').delete().eq('id', id);if(error) throw error;alert('Supprimé avec succès');await loadCreatorMedia();await fetchData();}catch(e){ alert('Erreur suppression: '+e.message); }}
function render(){
  let q=document.getElementById('search').value.toLowerCase();
  let fil=allData.filter(d=>d.type===tab&&d.titre.toLowerCase().includes(q));
  let el=document.getElementById('list');
  if(!fil.length){el.innerHTML=`<div style="text-align:center;padding:70px 20px;color:#555"><div style="font-size:56px">🎧</div><div style="margin-top:10px">Aucun ${tab}</div><small>Clique + et tape Diablo pour publier</small></div>`;return;}
  el.innerHTML=fil.map(d=>{
    if(d.type==='audio'){
      return `<div class="card">
        <div class="thumb">🎵</div>
        <div class="info">
          <h3>${d.titre}</h3><small>${d.name||''}</small>
          <div class="audio-player">
            <audio id="aud-${d.id}" src="${d.url}" preload="metadata"></audio>
            <div class="audio-controls">
              <button class="play-btn" id="btn-${d.id}" onclick="togglePlay('${d.id}')">▶️</button>
              <div class="progress-area">
                <div class="progress-bg" onclick="seek(event,'${d.id}')"><div class="progress-fill" id="fill-${d.id}"></div></div>
                <div class="time-row"><span id="cur-${d.id}">0:00</span><span id="dur-${d.id}">0:00</span></div>
              </div>
            </div>
          </div>
        </div>
        <a class="btn-down" href="${d.url}" download target="_blank">⬇️</a>
        <div class="menu-dot" onclick="toggleMenu('${d.id}')">⋮
          <div class="dropdown" id="drop-${d.id}">
            <button onclick="setSpeed('${d.id}',0.5)">🐢 Vitesse 0.5x</button>
            <button onclick="setSpeed('${d.id}',1)">▶️ Vitesse 1x</button>
            <button onclick="setSpeed('${d.id}',1.5)">⚡ Vitesse 1.5x</button>
            <button onclick="setSpeed('${d.id}',2)">🚀 Vitesse 2x</button>
            <button onclick="downloadFile('${d.url}')">⬇️ Télécharger</button>
          </div>
        </div>
      </div>`;
    } else {
      return `<div class="card" style="flex-direction:column;align-items:stretch">
        <div style="display:flex;gap:12px;align-items:center;width:100%">
          <div class="thumb">🎬</div>
          <div class="info"><h3>${d.titre}</h3><small>${d.name||''}</small></div>
          <a class="btn-down" href="${d.url}" download target="_blank">⬇️</a>
          <div class="menu-dot" onclick="toggleMenu('${d.id}')">⋮<div class="dropdown" id="drop-${d.id}"><button onclick="downloadFile('${d.url}')">⬇️ Télécharger</button></div></div>
        </div>
        <div class="video-wrap"><video id="vid-${d.id}" src="${d.url}" controls preload="metadata" playsinline onplay="handleVideoPlay('${d.id}')"></video></div>
      </div>`;
    }
  }).join('');
  fil.forEach(d=>{
    if(d.type==='audio'){
      let a=document.getElementById(`aud-${d.id}`);if(!a) return;
      a.addEventListener('loadedmetadata',()=>{let el=document.getElementById(`dur-${d.id}`); if(el) el.textContent=formatTime(a.duration)});
      a.addEventListener('timeupdate',()=>{let pct=(a.currentTime/a.duration)*100||0;let f=document.getElementById(`fill-${d.id}`); if(f) f.style.width=pct+'%';let c=document.getElementById(`cur-${d.id}`); if(c) c.textContent=formatTime(a.currentTime);});
      a.addEventListener('ended',()=>{let b=document.getElementById(`btn-${d.id}`); if(b) b.textContent='▶️';let f=document.getElementById(`fill-${d.id}`); if(f) f.style.width='0%';if(currentAudio===a){currentAudio=null;}});
      a.addEventListener('play',()=>{handleAudioPlay(d.id)});
    }
  });
}
function formatTime(s){if(isNaN(s))return '0:00';let m=Math.floor(s/60);let sec=Math.floor(s%60);return m+':'+(sec<10?'0'+sec:sec)}
function handleAudioPlay(id){document.querySelectorAll('audio, video').forEach(el=>{if(el.id!==`aud-${id}`){el.pause();}});currentAudio=document.getElementById(`aud-${id}`);}
function handleVideoPlay(id){document.querySelectorAll('audio, video').forEach(el=>{if(el.id!==`vid-${id}`){el.pause();}});document.querySelectorAll('.play-btn').forEach(b=>b.textContent='▶️');currentAudio=null;}
function togglePlay(id){let audio=document.getElementById(`aud-${id}`);let btn=document.getElementById(`btn-${id}`);if(!audio) return;if(audio.paused){document.querySelectorAll('audio, video').forEach(el=>{if(el!==audio) el.pause()});document.querySelectorAll('.play-btn').forEach(b=>{if(b!==btn) b.textContent='▶️'});audio.play();btn.textContent='⏸️';currentAudio=audio;}else{audio.pause();btn.textContent='▶️';}}
function seek(e,id){let audio=document.getElementById(`aud-${id}`);let bg=e.currentTarget;let rect=bg.getBoundingClientRect();let x=e.clientX-rect.left;let pct=x/rect.width;audio.currentTime=pct*audio.duration;}
function toggleMenu(id){let drop=document.getElementById(`drop-${id}`);let isShow=drop.classList.contains('show');document.querySelectorAll('.dropdown').forEach(d=>d.classList.remove('show'));if(!isShow) drop.classList.add('show');}
function setSpeed(id, speed){let audio=document.getElementById(`aud-${id}`);if(audio){audio.playbackRate=speed; audio.play();}document.querySelectorAll('.dropdown').forEach(d=>d.classList.remove('show'));}
function downloadFile(url){let a=document.createElement('a'); a.href=url; a.download=''; a.target='_blank'; document.body.appendChild(a); a.click(); a.remove();document.querySelectorAll('.dropdown').forEach(d=>d.classList.remove('show'));}
document.addEventListener('click',function(e){if(!e.target.closest('.menu-dot')){document.querySelectorAll('.dropdown').forEach(d=>d.classList.remove('show'));}});

// PWA INSTALL LOGIC CORRIGÉ
let deferredPrompt;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
  installBtn.classList.add('show');
});
function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(choice=>{
      if(choice.outcome==='accepted'){
        installBtn.classList.remove('show');
        gtag('event', 'pwa_install', { 'method': 'button' });
      }
      deferredPrompt=null;
    });
  } else {
    // Si déjà installé ou sur iPhone
    alert("Pour installer:\nSur Android: Menu Chrome ⋮ > Installer l'application\nSur iPhone: Partager > Sur l'écran d'accueil");
  }
}
window.addEventListener('appinstalled', ()=>{
  installBtn.classList.remove('show');
  console.log('JSK Music installée!');
});

fetchData();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}</script>
</body>
  </html>
